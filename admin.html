<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BouwFlow beheer</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#07172b;color:#10253e}.wrap{max-width:1050px;margin:auto;padding:35px 20px}.top{color:#fff;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:27px;font-weight:900}.brand span{color:#1681ff}.card{background:#fff;border-radius:18px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:2fr 2fr 2fr 1fr;gap:10px}input,button{padding:13px;border-radius:9px;border:1px solid #d8e1eb;font:inherit}button{background:#1681ff;color:#fff;border:0;font-weight:800;cursor:pointer}.customers{display:grid;gap:10px}.row{border:1px solid #e3e9ef;border-radius:12px;padding:15px;display:grid;grid-template-columns:2fr 1fr 1fr 2fr;align-items:center;gap:10px}.status{font-weight:800}.active{color:#168a52}.expired{color:#c33}.link{font-size:11px;word-break:break-all;color:#54718e}@media(max-width:750px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Bouw<span>Flow</span> beheer</div><div>Demo's & klanten</div></div><div class="card"><h2>Nieuwe 7-daagse demo</h2><div class="grid"><input id="company" placeholder="Bedrijfsnaam"><input id="email" type="email" placeholder="E-mailadres"><input id="appurl" placeholder="App URL (optioneel)"><button onclick="createDemo()">Start demo</button></div><p id="msg"></p></div><div class="card"><h2>Klanten</h2><div id="customers" class="customers">Laden...</div></div></div><script>
async function load(){const r=await fetch('/api/admin/customers');const d=await r.json();const el=document.getElementById('customers');if(!d.length){el.innerHTML='Nog geen demo’s.';return}el.innerHTML=d.map(c=>`<div class="row"><div><b>${esc(c.company)}</b><br><small>${esc(c.email||'')}</small></div><div class="status ${c.active?'active':'expired'}">${c.active?'Actief':'Verlopen'}</div><div>${c.permanent?'Vaste klant':c.days_left+' dag(en)'}</div><div><div class="link">${location.origin}${c.install_url}</div><button style="margin-top:7px" onclick="copyLink('${esc(c.install_url)}')">Kopieer link</button></div></div>`).join('')}
async function createDemo(){const body={company:company.value,email:email.value,app_url:appurl.value};const r=await fetch('/api/admin/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();document.getElementById('msg').textContent=d.message||'';if(r.ok){company.value='';email.value='';appurl.value='';load()}}
function copyLink(p){navigator.clipboard.writeText(location.origin+p)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
