name: Publish BouwFlow Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'windows-client/client.py'
      - '.github/workflows/publish-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name BouwFlow-Setup windows-client/client.py

      - name: Copy installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          Copy-Item dist/BouwFlow-Setup.exe downloads/BouwFlow-Setup.exe -Force

      - name: Commit installer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/BouwFlow-Setup.exe
          git diff --cached --quiet || git commit -m "Update BouwFlow Windows installer"
          git push
