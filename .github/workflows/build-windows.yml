name: Build BouwFlow Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows-client/client.py'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name BouwFlow-Setup windows-client/client.py

      - name: Publish latest installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-build | Out-Null
          Copy-Item dist/BouwFlow-Setup.exe windows-build/BouwFlow-Setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BouwFlow-Windows
          path: windows-build/BouwFlow-Setup.exe
          retention-days: 30
