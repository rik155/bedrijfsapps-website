<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BouwFlow beheer login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(145deg,#06172d,#0b315f);min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:#fff;border-radius:20px;padding:34px;box-shadow:0 25px 70px #0006}.brand{font-size:28px;font-weight:900;margin-bottom:8px;color:#10253e}.brand span{color:#1681ff}p{color:#6c7d8e;margin:0 0 24px}label{display:block;font-size:12px;font-weight:800;color:#31475d;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid #d7e1eb;border-radius:10px;font:inherit;margin-bottom:14px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#1681ff;color:#fff;font:inherit;font-weight:900;cursor:pointer}.msg{min-height:20px;color:#c33;font-size:12px;margin-top:12px}</style></head><body><form class="card" id="loginForm"><div class="brand">Bouw<span>Flow</span></div><p>Beheeromgeving</p><label>Wachtwoord</label><input id="password" type="password" autocomplete="current-password" autofocus required><button type="submit">Inloggen →</button><div class="msg" id="msg"></div></form><script>loginForm.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});const d=await r.json().catch(()=>({}));if(r.ok){location.href='/admin'}else{msg.textContent=d.message||'Inloggen mislukt.'}});</script></body></html>
